<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>点歌单 · 550 首</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@600;900&display=swap">
<style>
/* ===== 基础 ===== */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg0:#121419; --bg1:#1a1d25;
  --panel:#1e222b;
  --line:rgba(236,231,220,.08);
  --line-dash:rgba(236,231,220,.14);
  --ink:#ece7dc; --ink-dim:#9aa1ac;
  --gold:#d8a64e; --gold-soft:#e8c87e; --gold-deep:#a97d33;
  --serif:"Noto Serif SC","Songti SC","SimSun",serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
}
html{scroll-behavior:smooth}
body{
  font-family:var(--sans);
  color:var(--ink);
  background:
    radial-gradient(rgba(255,255,255,.018) 1px, transparent 1.4px) 0 0/3px 3px,
    linear-gradient(180deg,var(--bg0) 0%,var(--bg1) 420px,var(--bg0) 100%);
  background-attachment:fixed;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

/* ===== Hero：黑胶唱片 ===== */
.hero{text-align:center;padding:56px 20px 40px}
.vinyl{
  --d:min(200px,54vw);
  width:var(--d);height:var(--d);
  border-radius:50%;
  position:relative;
  margin:0 auto 26px;
  background:
    repeating-radial-gradient(circle at 50% 50%, #0b0d11 0 1.5px, #161922 1.5px 3px),
    radial-gradient(circle at 50% 50%, #14171d 0 62%, #0a0c10 78%);
  box-shadow:
    0 22px 60px rgba(0,0,0,.55),
    inset 0 0 0 2px rgba(255,255,255,.04),
    0 0 0 1px rgba(255,255,255,.05);
  animation:spin 16s linear infinite;
}
.vinyl::before{
  content:"";position:absolute;inset:24%;
  border-radius:50%;
  background:conic-gradient(from 20deg,#e9ca84,#b98a3a,#f0dca0,#a97d33,#e9ca84);
  box-shadow:0 0 0 1px rgba(0,0,0,.6), inset 0 0 12px rgba(120,84,20,.65);
}
.vinyl::after{
  content:"";position:absolute;inset:24%;
  border-radius:50%;
  background:radial-gradient(circle at 50% 50%, transparent 0 42%, rgba(236,231,220,.9) 43% 46%, transparent 47%);
  opacity:.92;
}
.vinyl .hole{
  position:absolute;left:50%;top:50%;width:7%;height:7%;
  transform:translate(-50%,-50%);
  border-radius:50%;background:#0a0c10;
  box-shadow:0 0 0 1px rgba(255,255,255,.12), inset 0 1px 3px rgba(0,0,0,.9);
  z-index:2;
}
.vinyl .sheen{
  position:absolute;inset:0;border-radius:50%;z-index:3;pointer-events:none;
  background:conic-gradient(from 205deg, rgba(255,255,255,.16), rgba(255,255,255,0) 32deg, rgba(255,255,255,0) 180deg, rgba(255,255,255,.05) 240deg, rgba(255,255,255,0) 300deg);
}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.vinyl{animation:none}}

.eyebrow{
  font-size:12px;letter-spacing:.42em;text-indent:.42em;
  color:var(--gold);text-transform:uppercase;margin-bottom:12px;
}
h1{
  font-family:var(--serif);font-weight:900;
  font-size:clamp(34px,8vw,52px);
  letter-spacing:.06em;
  color:var(--ink);
}
.hero .sub{
  margin-top:12px;color:var(--ink-dim);font-size:14px;letter-spacing:.04em;
}
.hero .sub b{color:var(--gold-soft);font-weight:600}

/* ===== 工具栏 ===== */
.toolbar{
  position:sticky;top:0;z-index:20;
  background:rgba(18,20,25,.88);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  padding:12px 16px;
}
.toolbar-inner{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.search{
  position:relative;max-width:520px;width:100%;margin:0 auto;
}
.search svg{
  position:absolute;left:13px;top:50%;transform:translateY(-50%);
  width:17px;height:17px;stroke:var(--ink-dim);fill:none;stroke-width:2;
  stroke-linecap:round;
}
.search input{
  width:100%;height:44px;padding:0 16px 0 42px;
  border-radius:22px;border:1px solid var(--line);
  background:rgba(255,255,255,.04);color:var(--ink);
  font-size:15px;font-family:var(--sans);
  outline:none;transition:border-color .2s, box-shadow .2s;
}
.search input::placeholder{color:#6d747f}
.search input:focus{border-color:rgba(216,166,78,.55);box-shadow:0 0 0 3px rgba(216,166,78,.14)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{
  appearance:none;border:1px solid var(--line);background:transparent;
  color:var(--ink-dim);font-size:13.5px;font-family:var(--sans);
  height:36px;padding:0 15px;border-radius:18px;cursor:pointer;
  transition:color .15s,border-color .15s,background .15s;
  letter-spacing:.02em;
}
.chip:hover{color:var(--ink);border-color:rgba(216,166,78,.4)}
.chip.active{
  background:var(--gold);border-color:var(--gold);color:#171207;font-weight:600;
}
.chip .cnt{opacity:.65;margin-left:4px;font-size:12px}

/* ===== 歌单列表 ===== */
main{max-width:1080px;margin:0 auto;padding:34px 16px 20px}
.group{margin-bottom:38px;display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));column-gap:30px}
.group-title{
  grid-column:1/-1;
  display:flex;align-items:center;gap:11px;
  font-family:var(--serif);font-weight:600;
  font-size:19px;letter-spacing:.12em;color:var(--gold-soft);
  margin:0 0 6px;padding-bottom:10px;border-bottom:1px solid var(--line);
}
.group-title::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--gold);flex:none}
.group-title .meta{font-family:var(--sans);font-size:12.5px;color:var(--ink-dim);letter-spacing:.06em;font-weight:400}
.song{
  display:flex;align-items:baseline;gap:11px;
  padding:7px 6px;border-bottom:1px dashed var(--line-dash);
  border-radius:4px;
}
.song:hover{background:rgba(216,166,78,.07)}
.song .no{
  font-family:var(--mono);font-size:12px;color:var(--gold);
  opacity:.8;font-variant-numeric:tabular-nums;
  flex:none;min-width:3.1em;text-align:right;
}
.song .name{font-size:15px;color:var(--ink);letter-spacing:.02em;line-height:1.5;word-break:break-all}
.song .name .sc{color:var(--gold-soft);font-size:.76em;margin-left:3px;letter-spacing:.05em}
.song .copy{
  margin-left:auto;flex:none;align-self:center;
  appearance:none;border:1px solid transparent;background:transparent;
  color:var(--ink-dim);font-size:12px;font-family:var(--sans);
  padding:2px 10px;border-radius:12px;cursor:pointer;
  opacity:0;transition:opacity .15s,color .15s,border-color .15s,background .15s;
  letter-spacing:.02em;
}
.song:hover .copy{opacity:1}
.song .copy:hover{color:var(--gold-soft);border-color:rgba(216,166,78,.35)}
.song .copy.done{opacity:1;color:#171207;background:var(--gold);border-color:var(--gold)}
@media (hover:none){.song .copy{opacity:.75}}
.empty{
  display:none;text-align:center;padding:56px 16px;color:var(--ink-dim);
  font-size:15px;letter-spacing:.05em;
}
.empty.show{display:block}
.empty b{display:block;font-family:var(--serif);font-size:20px;color:var(--gold-soft);margin-bottom:8px}

footer{
  max-width:1080px;margin:0 auto;padding:8px 16px 64px;text-align:center;
  color:#6d747f;font-size:12.5px;line-height:2;letter-spacing:.03em;
}
footer .rule{color:var(--ink-dim)}

/* ===== 响应式 ===== */
@media (max-width:640px){
  main{padding-top:26px}
  .group{grid-template-columns:1fr;column-gap:0}
  .song .name{font-size:15.5px}
  .hero{padding-top:44px}
}
@media (min-width:641px) and (max-width:960px){
  .group{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

const GROUP_META = {1:"一字",2:"二字",3:"三字",4:"四字",5:"五字",6:"六字以上"};
const GROUP_ORDER = [1,2,3,4,5,6];

// 按长度分组
const groups = {};
SONGS.forEach(s=>{const g=s.l>=6?6:s.l;(groups[g]=groups[g]||[]).push(s)});

const listEl = document.getElementById("list");
const emptyEl = document.getElementById("empty");
const chipsEl = document.getElementById("chips");
const searchEl = document.getElementById("search");

let activeGroup = "all";
let query = "";

// 分组 chips
const chips = [{key:"all",label:"全部",cnt:SONGS.length}]
  .concat(GROUP_ORDER.map(g=>({key:String(g),label:GROUP_META[g],cnt:groups[g].length})));
chips.forEach(c=>{
  const btn = document.createElement("button");
  btn.className = "chip" + (c.key==="all"?" active":"");
  btn.dataset.g = c.key;
  btn.setAttribute("role","tab");
  btn.innerHTML = c.label + ' <span class="cnt">' + c.cnt + '</span>';
  btn.addEventListener("click",()=>{activeGroup=c.key;render()});
  chipsEl.appendChild(btn);
});

// 复制文字到剪贴板（https 用 Clipboard API，其他环境自动降级）
function copyText(t){
  if(navigator.clipboard && window.isSecureContext){
    return navigator.clipboard.writeText(t);
  }
  const ta = document.createElement("textarea");
  ta.value = t;
  ta.setAttribute("readonly","");
  ta.style.position = "fixed"; ta.style.top = "-9999px";
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
  return Promise.resolve();
}

// 渲染
function render(){
  const q = query.trim().toLowerCase();
  const isSearch = q.length>0;
  listEl.innerHTML = "";
  let totalShown = 0;

  GROUP_ORDER.forEach(g=>{
    const songs = groups[g];
    const matched = songs.filter(s=>!isSearch || s.t.toLowerCase().includes(q) || String(s.n).includes(q));
    const showGroup = isSearch ? matched.length>0 : (activeGroup==="all" || activeGroup===String(g));
    if(!showGroup) return;
    totalShown += matched.length;

    const sec = document.createElement("section");
    sec.className = "group";

    const title = document.createElement("h2");
    title.className = "group-title";
    const metaTxt = isSearch
      ? (matched.length + " / " + songs.length + " 首")
      : (songs.length + " 首");
    title.innerHTML = GROUP_META[g] + ' <span class="meta">' + metaTxt + '</span>';
    sec.appendChild(title);

    matched.forEach(s=>{
      const row = document.createElement("div");
      row.className = "song";
      const no = document.createElement("span");
      no.className = "no"; no.textContent = s.n;
      const nm = document.createElement("span");
      nm.className = "name";
      const scSuffix = /(\(sc\))$/.exec(s.t);
      let copyName;
      if(scSuffix){
        const head = document.createTextNode(s.t.slice(0, scSuffix.index));
        const sc = document.createElement("span");
        sc.className = "sc"; sc.textContent = "(sc)";
        nm.appendChild(head); nm.appendChild(sc);
        copyName = s.t.slice(0, scSuffix.index);
      }else{
        nm.textContent = s.t;
        copyName = s.t;
      }
      row.appendChild(no); row.appendChild(nm);

      const copyBtn = document.createElement("button");
      copyBtn.type = "button";
      copyBtn.className = "copy";
      copyBtn.textContent = "复制";
      copyBtn.setAttribute("aria-label","复制歌名 " + copyName);
      copyBtn.addEventListener("click",()=>{
        copyText(copyName).then(()=>{
          copyBtn.textContent = "已复制";
          copyBtn.classList.add("done");
          setTimeout(()=>{
            copyBtn.textContent = "复制";
            copyBtn.classList.remove("done");
          },1200);
        });
      });
      row.appendChild(copyBtn);
      sec.appendChild(row);
    });
    listEl.appendChild(sec);
  });

  emptyEl.classList.toggle("show", totalShown===0);
}

searchEl.addEventListener("input",()=>{query=searchEl.value;render()});

// 初始化
render();
</script>
